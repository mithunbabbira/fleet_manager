; Lab-only ESP32-CAM stills firmware — not linked into fleet_v2_master.
; Board: AI Thinker ESP32-CAM (OV2640). Flash via FTDI (5 V, IO0→GND for download).
;
; pio is usually: ~/.platformio/penv/bin/pio  (or export PATH="$HOME/.platformio/penv/bin:$PATH")

[env:softap_lab]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.6
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCAM_WIFI_SSID=\"Fleet-CAM\"
  -DCAM_WIFI_PASS=\"fleetcams\"
  -DCAM_SERVO_PIN=13
  -DCAM_SERVO_SETTLE_MS=1000
  -DCAM_SERVO_MS_PER_DEG=8
  -DCAM_SERVO_MIN_US=500
  -DCAM_SERVO_MAX_US=2400
; esp_camera.h comes from the Arduino-ESP32 framework.
; Servo (SG90 / MG996R) signal → GPIO13; V+ from 5V, common GND.

; Join master_lab SoftAP (Fleet-C6). Static IP 192.168.4.10 — avoids SoftAP DHCP .2 clash.
[env:sta_master]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
  madhephaestus/ESP32Servo @ ^3.0.6
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCAM_STA_MODE=1
  -DCAM_WIFI_SSID=\"Fleet-C6\"
  -DCAM_WIFI_PASS=\"fleetc61\"
  -DCAM_STA_IP_A=192
  -DCAM_STA_IP_B=168
  -DCAM_STA_IP_C=4
  -DCAM_STA_IP_D=10
  -DCAM_SERVO_PIN=13
  -DCAM_SERVO_SETTLE_MS=1000
  -DCAM_SERVO_MS_PER_DEG=8
  -DCAM_SERVO_MIN_US=500
  -DCAM_SERVO_MAX_US=2400
