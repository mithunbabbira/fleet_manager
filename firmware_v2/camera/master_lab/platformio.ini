; Lab SoftAP bridge on ESP32-C6 (Super Mini / XIAO C6).
; Not part of fleet_v2_master — prove CAM trigger before porting into production firmware.
;
; SoftAP: Fleet-C6 / fleetc61 @ 192.168.4.1  (CAM only)
; Internet: EC200U LTE UART GPIO16 TX / GPIO17 RX (QHTTP upload + QMT MQTT)
; Upload URL: public ngrok HTTPS to tools/cam_lab_api (set via USB uploadurl)
; CAM STA static 192.168.4.10

[env:master_lab_c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DMASTER_AP_SSID=\"Fleet-C6\"
  -DMASTER_AP_PASS=\"fleetc61\"
  -DCAM_STA_IP=\"192.168.4.10\"
  -DCAM_CAPTURE_PATH=\"/capture\"
  -DLAB_LTE_APN=\"airtelgprs.com\"
  -DLAB_LTE_MQTT_HOST=\"test.mosquitto.org\"
  -DLAB_LTE_MQTT_PORT=1883
  -DLAB_MQTT_HOST=\"test.mosquitto.org\"
  -DLAB_MQTT_PORT=1883
