; UL212 RS-232 fetch — XIAO ESP32-C6 + MAX232 + Zigbee ED (no Bluetooth)
[platformio]
default_envs = seeed_xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_zigbee.csv
board_upload.maximum_size = 1900544
board_build.zigbee_mode = ed
board_build.usb_mode = hwcdc
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
; chain+ so FleetZigbee/Arduino deps (e.g. Preferences.h) resolve on clean builds
lib_ldf_mode = chain+
lib_deps =
  FleetProtocol
  FleetZigbee
  Zigbee
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DZIGBEE_MODE_ED
  -DFLEET_ZIGBEE_ED_RADIO=1
  -include include/zigbee_app_config.h

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
