; UL212 dummy Zigbee ED — ESP32-C6 Super Mini (no sensor; synthetic 1088)
[platformio]
default_envs = esp32-c6-devkitc-1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_zigbee.csv
board_upload.maximum_size = 1900544
board_build.zigbee_mode = ed
board_build.usb_mode = hwcdc
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_ldf_mode = chain+
lib_deps =
  FleetProtocol
  FleetZigbee
  Zigbee
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DZIGBEE_MODE_ED
  -DFLEET_ZIGBEE_ED_RADIO=1
  -include include/zigbee_app_config.h

[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
