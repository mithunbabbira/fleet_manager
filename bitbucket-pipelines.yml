# ESP-IDF build for firmware_v2/master (ESP32-C6 fleet telematics carrier).
#
# Pinned to v5.2.3 specifically (not the rolling release-v5.2 tag) —
# firmware_v2/master/components/lte/lte.c's UART1 clock-enable workaround
# depends on esp_private/uart_private.h, which moved/was removed in IDF
# 5.3 and isn't guaranteed stable across every 5.2.x patch either. Do not
# bump this image tag without first confirming that workaround still
# compiles.
#
# Uses Espressif's official IDF Docker image, which ships the whole
# toolchain (cmake, ninja, python3) baked in — but Bitbucket Pipelines runs
# step scripts directly rather than through the image's entrypoint, so none
# of that lands on PATH automatically. Steps that call idf.py/cmake source
# $IDF_PATH/export.sh first to pull in what's already in the image; nothing
# is installed at runtime there. Host unit tests don't need the ESP-IDF
# toolchain at all, so that step just runs on plain Ubuntu instead.
#
# Branch triggers — only these two branches auto-run anything:
#   - dev-main -> the development branch. Builds its own binary every push
#     (tagged "<VERSION>-dev.<build#>") and publishes it as environment=dev.
#   - main     -> the release branch. Compiled ONCE per pipeline run (tagged
#     "<VERSION>-rel.<build#>"), published under environment=staging, then
#     the exact same dist/ artifact — not a rebuild — is published again
#     under environment=prod behind a manual approval gate. This guarantees
#     staging and prod ship byte-identical binaries.
# Both flows are also runnable on demand as custom pipelines (still named
# "dev" / "staging" below) regardless of which branch is checked out. There
# is no standalone "build prod" pipeline — prod only ever receives a
# promoted release build, never its own compile. Any other branch falls
# through to `default`: build + host tests only, no publish.
#
# Publishing (tools/ci/publish_firmware.sh) POSTs the built .bin to Trafyn's
# publish-device-firmware workflow — that's the only distribution path;
# there is no S3 upload. This is also what makes the build discoverable by
# the device's own OTA check (components/ota/ota_cloud.c). manufacturer/
# deviceType in the script must match components/ota/Kconfig's defaults
# exactly ("Espressif Systems" / "fleet monitor").
#
# Required setup in Bitbucket repo settings -> Deployments, one environment
# each named exactly "dev", "staging", "prod", with these variables set
# (secured):
#   TRAFYN_AUTH_USER, TRAFYN_AUTH_PASS, TRAFYN_SYSTEM_USER_ID
# Scoping them per-environment lets dev/staging/prod use different Trafyn
# credentials if you ever want that, and gives you a Deployments dashboard
# showing which version is live in each environment.
#
# Each flow runs the tests/host ctest suite as its first step; the
# build/publish steps never run if any test fails.
#
# Product app path: firmware_v2/master (artifact: fleet_v2_master.bin).
image: espressif/idf:v5.2.3

definitions:
  steps:
    - step: &build-generic
        name: Build firmware
        size: 2x
        script:
          - . "$IDF_PATH/export.sh"
          - cd firmware_v2/master
          - idf.py set-target esp32c6
          - idf.py build

    - step: &build-dev
        name: Build firmware (dev)
        size: 2x
        script:
          - bash tools/ci/build_firmware.sh dev
        artifacts:
          - dist/**
    - step: &publish-dev
        name: Publish to Trafyn (dev)
        deployment: dev
        script:
          - bash tools/ci/publish_firmware.sh dev

    - step: &build-release
        name: Build firmware (release candidate)
        size: 2x
        script:
          - bash tools/ci/build_firmware.sh rel
        artifacts:
          - dist/**
    - step: &publish-staging
        name: Publish to Trafyn (staging)
        deployment: staging
        script:
          - bash tools/ci/publish_firmware.sh staging
    - step: &publish-prod
        name: Publish to Trafyn (prod)
        deployment: prod
        trigger: manual
        script:
          # Publishes the SAME dist/ produced by build-release above — no
          # rebuild, so prod is guaranteed byte-identical to staging.
          - bash tools/ci/publish_firmware.sh prod

    - step: &host-tests
        name: Host unit tests
        # Plain Ubuntu — the host test suite is pure C with no ESP-IDF
        # dependency, so it doesn't need the (much heavier) IDF image.
        image: ubuntu:22.04
        script:
          - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake build-essential libcjson-dev
          - cmake -S tests/host -B tests/host/build
          - cmake --build tests/host/build
          - ctest --test-dir tests/host/build --output-on-failure

pipelines:
  default:
    - step: *host-tests
    - step: *build-generic

  branches:
    dev-main:
      - step: *host-tests
      - step: *build-dev
      - step: *publish-dev
    main:
      - step: *host-tests
      - step: *build-release
      - step: *publish-staging
      - step: *publish-prod

  custom:
    dev:
      - step: *host-tests
      - step: *build-dev
      - step: *publish-dev
    staging:
      - step: *host-tests
      - step: *build-release
      - step: *publish-staging
      - step: *publish-prod
